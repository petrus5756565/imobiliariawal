{% extends "base.html" %}
{% block titulo %}Login - {{ site.nome }}{% endblock %}

{% block conteudo %}
<div class="container">
  <div class="pagina-form">
    <h1>Área da Corretora</h1>
    <p class="subtitulo">Entre com seu usuário e senha para gerenciar os imóveis.</p>
    <form method="post">
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" required autofocus>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>
      </div>
      <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
